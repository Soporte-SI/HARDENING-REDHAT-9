; Inventario SOLO para pruebas locales contra tu VM de Rocky Linux en VirtualBox.
; No usar este archivo para los servidores reales del banco - ese es hosts.ini.
; Este archivo es de uso personal - no hace falta subirlo a git (puedes borrarlo
; cuando termines de probar, no afecta nada mientras no se lo pases con -i).

[rhel9]
192.168.3.5 ansible_host=192.168.3.5

[rhel9:vars]
ansible_user=rockylinux
ansible_python_interpreter=/usr/bin/python3
; con --ask-pass te pide la clave del usuario de arriba al ejecutar
; con --ask-become-pass te pide la clave de sudo (puede ser la misma)
