; Copiar este archivo a inventory/hosts.ini y ajustar a los hosts reales.
; Ejemplo minimo para Banco Solidario - grupo "rhel9" es el que consume site.yml

[rhel9]
srv-rhel9-app01.solidario.local   ansible_host=10.10.10.11
srv-rhel9-app02.solidario.local   ansible_host=10.10.10.12
; srv-rhel9-db01.solidario.local  ansible_host=10.10.10.21

[rhel9:vars]
ansible_user=ansible_svc
ansible_python_interpreter=/usr/bin/python3
; ansible_become_password se solicita en runtime con --ask-become-pass,
; o se resuelve desde el vault del proyecto (ver README seccion Credenciales).
