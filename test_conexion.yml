---
# Playbook: test_linux_connectivity.yml
# Prueba de conectividad SSH contra hosts Linux (RedHat/AIX) usando
# ansible.builtin.ping. No aplica ningun cambio (es solo diagnostico).
#
# Uso CLI:
#   ansible-playbook playbooks/test_linux_connectivity.yml \
#     -i inventories/production/hosts.yml
#
# Ad-hoc equivalente (sin playbook):
#   ansible all -i inventories/production/hosts.yml -m ansible.builtin.ping

- name: Prueba de conectividad SSH (ping/pong)
  hosts: all
  gather_facts: false

  pre_tasks:
    # AGREGADO 2026-09-01: obtiene el ticket Kerberos ANTES de que Ansible
    # intente conectarse por SSH a hosts del dominio BSCLUSTER.INT (ej.
    # 10.110.9.188) con el usuario de servicio svc_si_ansible. Sin esto, el
    # SSH sigue fallando con "Permission denied" aunque el Execution
    # Environment ya tenga los binarios de Kerberos (EE Kerberos -
    # Antifraude/RHEL9, ver Ansible/execution-environment-krb5/) - hace
    # falta además un ticket válido en el momento de conectar.
    #
    # Las variables krb5_keytab_path_b64 y krb5_principal las inyecta la
    # Credential de tipo "SSH Kerberos - Keytab" (Custom Credential Type,
    # ver docs completos en
    # Ansible/execution-environment-krb5/kerberos_ticket_en_awx.md, Opción
    # A) - hay que crearla en AWX y adjuntarla al Job Template una vez que
    # el equipo de AD genere el keytab de svc_si_ansible@BSCLUSTER.INT.
    #
    # Mientras no exista esa Credential (keytab pendiente de AD), esta
    # tarea simplemente no corre (el "when" la salta) y el resto del
    # playbook sigue igual que antes.
    - name: "Kerberos - Obtener ticket antes de conectar por SSH"
      delegate_to: localhost
      become: false
      when: krb5_keytab_path_b64 is defined
      block:
        - name: "Kerberos - Decodificar el keytab"
          ansible.builtin.copy:
            content: "{{ krb5_keytab_path_b64 | b64decode }}"
            dest: "/tmp/svc_si_ansible.keytab"
            mode: "0600"
          no_log: true

        # AGREGADO 2026-09-03 (TEMPORAL - quitar una vez resuelto el kinit):
        # el job 138 volvió a fallar con el MISMO error que teníamos antes de
        # construir el EE con el subperfil AD-SUPPORT ("kinit: Pre-
        # authentication failed: Invalid argument while getting initial
        # credentials"). Eso es sospechoso - si el fix de crypto-policies
        # hubiera quedado bien aplicado en la imagen que se importó al nodo,
        # este error debería haber cambiado. Estas dos tareas de diagnóstico
        # corren ANTES del kinit (a diferencia de él, no pueden fallar el
        # play) para confirmar, dentro del contenedor real que usa AWX, si
        # el EE que se está ejecutando realmente tiene el subperfil AD-
        # SUPPORT activo y el allow_weak_crypto en krb5.conf - o si por algo
        # (build viejo, imagen no reimportada, tag no actualizado) se está
        # usando una versión del EE anterior a ese cambio.
        - name: "Kerberos - DIAGNOSTICO: politica de crypto activa en el EE"
          ansible.builtin.command: update-crypto-policies --show
          register: krb5_diag_crypto_policy
          changed_when: false
          failed_when: false

        - name: "Kerberos - DIAGNOSTICO: mostrar resultado de la politica de crypto"
          ansible.builtin.debug:
            msg: "Politica de crypto activa: {{ krb5_diag_crypto_policy.stdout | default('(sin salida - rc=' + (krb5_diag_crypto_policy.rc | default('?') | string) + ')') }}"

        - name: "Kerberos - DIAGNOSTICO: contenido de /etc/krb5.conf"
          ansible.builtin.command: cat /etc/krb5.conf
          register: krb5_diag_conf
          changed_when: false
          failed_when: false

        - name: "Kerberos - DIAGNOSTICO: mostrar krb5.conf"
          ansible.builtin.debug:
            msg: "{{ krb5_diag_conf.stdout_lines | default(['(sin salida - rc=' + (krb5_diag_conf.rc | default('?') | string) + ')']) }}"
        # FIN DIAGNOSTICO TEMPORAL

        - name: "Kerberos - kinit con el keytab"
          ansible.builtin.command: >
            kinit -kt /tmp/svc_si_ansible.keytab {{ krb5_principal }}
          changed_when: false

        # AGREGADO 2026-09-03 (TEMPORAL - quitar una vez resuelto el SSH):
        # el kinit ya funciona (confirmado en job anterior), pero el SSH
        # posterior sigue rechazado con "Permission denied" listando
        # gssapi-keyex/gssapi-with-mic como métodos que el servidor acepta -
        # o sea, nunca llega a intentarlos con éxito. "klist" confirma si el
        # ticket realmente quedó disponible en el cache que va a usar el
        # cliente SSH (y en qué backend - FILE vs KEYRING importa: si es
        # KEYRING, el ticket puede no ser visible entre procesos/sesiones
        # distintos dentro del mismo contenedor, aunque el kinit haya sido
        # exitoso).
        - name: "Kerberos - DIAGNOSTICO: klist despues del kinit"
          ansible.builtin.command: klist -A
          register: krb5_diag_klist
          changed_when: false
          failed_when: false

        - name: "Kerberos - DIAGNOSTICO: mostrar klist"
          ansible.builtin.debug:
            msg: "{{ krb5_diag_klist.stdout_lines | default(['(sin salida - rc=' + (krb5_diag_klist.rc | default('?') | string) + ')']) + krb5_diag_klist.stderr_lines | default([]) }}"
        # FIN DIAGNOSTICO TEMPORAL

  tasks:
    - name: ping | Probar conectividad SSH
      ansible.builtin.ping:
      register: ssh_ping_result

    - name: ping | Mostrar resultado por host
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} -> {{ ssh_ping_result.ping }}"
      when: ssh_ping_result.ping is defined
