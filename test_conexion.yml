---
# Playbook: test_linux_connectivity.yml
# Prueba de conectividad SSH contra hosts Linux (RedHat/AIX) usando
# ansible.builtin.ping. No aplica ningun cambio (es solo diagnostico).
#
# Uso CLI:
#   ansible-playbook playbooks/test_linux_connectivity.yml \
#     -i inventories/production/hosts.yml
#
# Ad-hoc equivalente (sin playbook):
#   ansible all -i inventories/production/hosts.yml -m ansible.builtin.ping

- name: Prueba de conectividad SSH (ping/pong)
  hosts: all
  gather_facts: false

  pre_tasks:
    # AGREGADO 2026-09-01: obtiene el ticket Kerberos ANTES de que Ansible
    # intente conectarse por SSH a hosts del dominio BSCLUSTER.INT (ej.
    # 10.110.9.188) con el usuario de servicio svc_si_ansible. Sin esto, el
    # SSH sigue fallando con "Permission denied" aunque el Execution
    # Environment ya tenga los binarios de Kerberos (EE Kerberos -
    # Antifraude/RHEL9, ver Ansible/execution-environment-krb5/) - hace
    # falta además un ticket válido en el momento de conectar.
    #
    # Las variables krb5_keytab_path_b64 y krb5_principal las inyecta la
    # Credential de tipo "SSH Kerberos - Keytab" (Custom Credential Type,
    # ver docs completos en
    # Ansible/execution-environment-krb5/kerberos_ticket_en_awx.md, Opción
    # A) - hay que crearla en AWX y adjuntarla al Job Template una vez que
    # el equipo de AD genere el keytab de svc_si_ansible@BSCLUSTER.INT.
    #
    # Mientras no exista esa Credential (keytab pendiente de AD), esta
    # tarea simplemente no corre (el "when" la salta) y el resto del
    # playbook sigue igual que antes.
    - name: "Kerberos - Obtener ticket antes de conectar por SSH"
      delegate_to: localhost
      become: false
      when: krb5_keytab_path_b64 is defined
      block:
        - name: "Kerberos - Decodificar el keytab"
          ansible.builtin.copy:
            content: "{{ krb5_keytab_path_b64 | b64decode }}"
            dest: "/tmp/svc_si_ansible.keytab"
            mode: "0600"
          no_log: true

        - name: "Kerberos - kinit con el keytab"
          ansible.builtin.command: >
            kinit -kt /tmp/svc_si_ansible.keytab {{ krb5_principal }}
          changed_when: false

  tasks:
    - name: ping | Probar conectividad SSH
      ansible.builtin.ping:
      register: ssh_ping_result

    - name: ping | Mostrar resultado por host
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} -> {{ ssh_ping_result.ping }}"
      when: ssh_ping_result.ping is defined
