---
# Playbook principal - CIS RHEL 9 Benchmark v2.0.0, Nivel 1 + Nivel 2, perfil Server
# Banco Solidario / GMS - Playbook 1 de 18
#
# Uso:
#   ansible-playbook -i inventory/hosts.ini site.yml --ask-become-pass
#   ansible-playbook -i inventory/hosts.ini site.yml --check --diff   (modo simulacion)
#   ansible-playbook -i inventory/hosts.ini site.yml --tags "5.1"     (solo SSH)
#   ansible-playbook -i inventory/hosts.ini site.yml --skip-tags "6.3" (excluye auditd)
#
# Ver README.md para detalle completo de uso, variables y advertencias.

- name: CIS RHEL 9 Hardening - Banco Solidario
  hosts: rhel9
  become: true
  # CORREGIDO 2026-09-04: gather_facts se pasa a false y se hace explicito
  # dentro de pre_tasks, DESPUES del kinit - con gather_facts:true, Ansible
  # intenta conectarse por SSH (para el modulo "setup") ANTES de que corra
  # ningun pre_task, así que el ticket Kerberos nunca llegaba a existir a
  # tiempo. Esto es lo que causaba "UNREACHABLE... Permission denied
  # (publickey,gssapi-keyex,gssapi-with-mic,password,keyboard-interactive)"
  # contra 10.110.9.188 (job 192) - el mismo host que ya funciona a mano
  # (ver kerberos_ticket_en_awx.md) y con el playbook de diagnostico
  # test_conexion.yml, que SI tiene gather_facts:false + este mismo bloque.
  # Este playbook de produccion nunca habia recibido ese fix - solo el de
  # pruebas.
  gather_facts: false
  any_errors_fatal: false
  max_fail_percentage: 100

  pre_tasks:
    # AGREGADO 2026-09-04: mismo mecanismo que test_conexion.yml - obtiene
    # el ticket Kerberos ANTES de que Ansible intente conectarse por SSH a
    # hosts del dominio BSCLUSTER.INT. Las variables krb5_keytab_path_b64 y
    # krb5_principal las inyecta la Credential "SSH Kerberos - Keytab" (ya
    # adjunta a este Job Template en AWX, ver Detalles del job: "Nube: Linux
    # Kerberos"). Sin este bloque, el EE Kerberos tiene los binarios pero
    # nunca llega a pedir el ticket - ver
    # Ansible/execution-environment-krb5/kerberos_ticket_en_awx.md.
    - name: "Kerberos - Obtener ticket antes de conectar por SSH"
      delegate_to: localhost
      become: false
      when: krb5_keytab_path_b64 is defined
      block:
        - name: "Kerberos - Decodificar el keytab"
          ansible.builtin.copy:
            content: "{{ krb5_keytab_path_b64 | b64decode }}"
            dest: "/tmp/svc_si_ansible.keytab"
            mode: "0600"
          no_log: true

        - name: "Kerberos - kinit con el keytab"
          ansible.builtin.command: >
            kinit -kt /tmp/svc_si_ansible.keytab {{ krb5_principal }}
          changed_when: false
      tags: always

    - name: "Recolectar hechos (despues del kinit, no antes)"
      ansible.builtin.setup:
      tags: always

    - name: Verificar que el sistema operativo es RHEL/compatible 9.x
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] in ['RedHat', 'CentOS', 'Rocky', 'AlmaLinux', 'OracleLinux']
          - ansible_facts['distribution_major_version'] == '9'
        fail_msg: >-
          Este playbook esta diseñado y validado unicamente para RHEL 9 (o derivados
          compatibles: Rocky/Alma/OL 9). Sistema detectado:
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
        success_msg: "Sistema operativo compatible detectado, se procede con el hardening."
      tags: always

    - name: Recolectar inventario de paquetes instalados (usado por multiples controles)
      ansible.builtin.package_facts:
        manager: auto
      tags: always

  roles:
    - role: rhel9_cis_hardening

  post_tasks:
    - name: Aviso si alguna tarea marco que se requiere reinicio
      ansible.builtin.debug:
        msg: >-
          Se aplicaron cambios que requieren REINICIO del sistema (GRUB/kernel/auditd
          en modo inmutable, crypto-policies, etc.) para quedar completamente activos.
          Coordinar la ventana de mantenimiento correspondiente.
      when: rhel9cis_reboot_required | default(false) | bool
      tags: always
