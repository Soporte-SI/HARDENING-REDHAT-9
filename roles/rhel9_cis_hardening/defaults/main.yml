---
# =============================================================================
# rhel9_cis_hardening - default variables
# Banco Solidario / GMS - Playbook 1/18: CIS RHEL 9 Benchmark v2.0.0, Nivel 1 + 2, perfil Server
# =============================================================================

# -----------------------------------------------------------------------------
# Nivel CIS a aplicar: 1 = solo Nivel 1, 2 = Nivel 1 + Nivel 2 (recomendado banco)
# -----------------------------------------------------------------------------
rhel9cis_level: 2

# Perfil del benchmark. Este rol implementa unicamente el perfil "Server".
rhel9cis_profile: server

# -----------------------------------------------------------------------------
# Toggles funcionales / de entorno
# -----------------------------------------------------------------------------
# Poner en true SOLO en la primera corrida de verificacion (no aplica cambios,
# usar ansible-playbook --check --diff en su lugar; este flag es independiente)
rhel9cis_reboot_required: false  # se activa via set_fact/handler cuando una tarea exige reinicio

# systemd-based facilities
rhel9cis_is_container: false  # poner true si el host es un contenedor (omite tareas de kernel/grub/particiones)

# Utilidad de firewall a usar de forma exclusiva: "firewalld" (por defecto, recomendado) o "nftables"
rhel9cis_firewall_utility: firewalld

# GRUB2 bootloader password (seccion 1.4.1). Vacio = tarea se omite (requiere definir via vault).
rhel9cis_grub_user: root
rhel9cis_grub_password: ""

# sudo: grupo autorizado a usar `su` (seccion 5.2.7)
rhel9cis_su_group: sugroup

# SSH: listas de control de acceso (seccion 5.1.7) - AllowGroups tiene prioridad si no esta vacio
rhel9cis_sshd_allow_groups: []
rhel9cis_sshd_allow_users: []
rhel9cis_sshd_deny_groups: []
rhel9cis_sshd_deny_users: []

# journald / auditd remote log host (dejar vacio para no configurar envio remoto; ver 6.2.3.6 manual)
rhel9cis_remote_log_host: ""

# UID minimo interactivo, se autodetecta de /etc/login.defs si se deja en 0
rhel9cis_uid_min_override: 0

# -----------------------------------------------------------------------------
# Toggles individuales por control CIS (una variable booleana por control)
# Poner en false para EXCEPTUAR un control puntual documentado por el banco.
# -----------------------------------------------------------------------------

