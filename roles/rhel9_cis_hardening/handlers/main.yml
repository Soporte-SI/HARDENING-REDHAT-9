---
# Handlers - rhel9_cis_hardening

- name: mark reboot required
  ansible.builtin.set_fact:
    rhel9cis_reboot_required: true
  listen: "mark reboot required"

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  listen: "reload systemd"

- name: restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted
  listen: "restart sshd"

- name: restart chronyd
  ansible.builtin.systemd:
    name: chronyd
    state: restarted
  listen: "restart chronyd"

- name: restart crond
  ansible.builtin.systemd:
    name: crond
    state: restarted
  listen: "restart crond"

- name: restart postfix
  ansible.builtin.systemd:
    name: postfix
    state: restarted
  listen: "restart postfix"

- name: restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
  listen: "restart rsyslog"

- name: restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
  listen: "restart systemd-journald"

- name: restart systemd-journal-upload
  ansible.builtin.systemd:
    name: systemd-journal-upload
    state: restarted
  listen: "restart systemd-journal-upload"

- name: reload firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: reloaded
  listen: "reload firewalld"

- name: reload nftables
  ansible.builtin.systemd:
    name: nftables
    state: reloaded
  listen: "reload nftables"

- name: apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
  listen: "apply sysctl"

- name: load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  listen: "load audit rules"
  notify: "mark reboot required"

- name: restart auditd
  ansible.builtin.systemd:
    name: auditd
    state: restarted
  listen: "restart auditd"

- name: update grub config
  ansible.builtin.command: >-
    grub2-mkconfig -o {{ (ansible_facts['distribution'] == 'RedHat' and
    ansible_facts['architecture'] == 'x86_64') |
    ternary('/boot/grub2/grub.cfg', '/boot/efi/EFI/redhat/grub.cfg') }}
  changed_when: true
  listen: "update grub config"
  notify: "mark reboot required"

- name: authselect apply-changes
  ansible.builtin.command: authselect apply-changes
  changed_when: true
  listen: "authselect apply-changes"

- name: rebuild dconf database
  ansible.builtin.command: dconf update
  changed_when: true
  listen: "rebuild dconf database"

- name: remount tmp
  ansible.posix.mount:
    path: /tmp
    state: remounted
  listen: "remount tmp"

- name: remount dev-shm
  ansible.posix.mount:
    path: /dev/shm
    state: remounted
  listen: "remount dev-shm"

- name: remount home
  ansible.posix.mount:
    path: /home
    state: remounted
  listen: "remount home"

- name: remount var
  ansible.posix.mount:
    path: /var
    state: remounted
  listen: "remount var"

- name: remount var-tmp
  ansible.posix.mount:
    path: /var/tmp
    state: remounted
  listen: "remount var-tmp"

- name: remount var-log
  ansible.posix.mount:
    path: /var/log
    state: remounted
  listen: "remount var-log"

- name: remount var-log-audit
  ansible.posix.mount:
    path: /var/log/audit
    state: remounted
  listen: "remount var-log-audit"
