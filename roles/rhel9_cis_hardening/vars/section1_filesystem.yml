---
# Datos para 1.1 Filesystem (modulos de kernel de filesystems y particiones)

rhel9cis_fs_kernel_modules:
  - { id: "1.1.1.1", module: cramfs, level: 1 }
  - { id: "1.1.1.2", module: freevxfs, level: 1 }
  - { id: "1.1.1.3", module: hfs, level: 1 }
  - { id: "1.1.1.4", module: hfsplus, level: 1 }
  - { id: "1.1.1.5", module: jffs2, level: 1 }
  - { id: "1.1.1.6", module: squashfs, level: 2 }
  - { id: "1.1.1.7", module: udf, level: 2 }
  - { id: "1.1.1.8", module: usb-storage, level: 1 }

# 1.1.2.x.1 - Particiones separadas requeridas (auditoria no destructiva, no se particiona disco)
rhel9cis_separate_partitions:
  - { id: "1.1.2.1.1", path: /tmp, level: 1 }
  - { id: "1.1.2.2.1", path: /dev/shm, level: 1 }
  - { id: "1.1.2.3.1", path: /home, level: 2 }
  - { id: "1.1.2.4.1", path: /var, level: 2 }
  - { id: "1.1.2.5.1", path: /var/tmp, level: 2 }
  - { id: "1.1.2.6.1", path: /var/log, level: 2 }
  - { id: "1.1.2.7.1", path: /var/log/audit, level: 2 }

# 1.1.2.x.{2,3,4} - Opciones de montaje nodev/nosuid/noexec (todas Nivel 1) sobre particiones
# que ya existen como puntos de montaje separados. No se crean particiones aqui.
rhel9cis_partition_options:
  - path: /tmp
    nodev: { id: "1.1.2.1.2" }
    nosuid: { id: "1.1.2.1.3" }
    noexec: { id: "1.1.2.1.4" }
  - path: /dev/shm
    nodev: { id: "1.1.2.2.2" }
    nosuid: { id: "1.1.2.2.3" }
    noexec: { id: "1.1.2.2.4" }
  - path: /home
    nodev: { id: "1.1.2.3.2" }
    nosuid: { id: "1.1.2.3.3" }
  - path: /var
    nodev: { id: "1.1.2.4.2" }
    nosuid: { id: "1.1.2.4.3" }
  - path: /var/tmp
    nodev: { id: "1.1.2.5.2" }
    nosuid: { id: "1.1.2.5.3" }
    noexec: { id: "1.1.2.5.4" }
  - path: /var/log
    nodev: { id: "1.1.2.6.2" }
    nosuid: { id: "1.1.2.6.3" }
    noexec: { id: "1.1.2.6.4" }
  - path: /var/log/audit
    nodev: { id: "1.1.2.7.2" }
    nosuid: { id: "1.1.2.7.3" }
    noexec: { id: "1.1.2.7.4" }
