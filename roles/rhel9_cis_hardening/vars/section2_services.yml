---
# 2.1 - Servicios que no deben estar en uso en un servidor endurecido.
# Estrategia: detener + deshabilitar + enmascarar la unidad systemd (evita reactivacion
# accidental por dependencias) en lugar de desinstalar el paquete, para no romper
# dependencias de otros paquetes en un servidor de produccion bancario.
rhel9cis_unused_services:
  - { id: "2.1.1", level: 1, unit: autofs.service }
  - { id: "2.1.2", level: 1, unit: avahi-daemon.service }
  - { id: "2.1.2", level: 1, unit: avahi-daemon.socket }
  - { id: "2.1.3", level: 1, unit: dhcpd.service }
  - { id: "2.1.3", level: 1, unit: dhcpd6.service }
  - { id: "2.1.4", level: 1, unit: named.service }
  - { id: "2.1.5", level: 1, unit: dnsmasq.service }
  - { id: "2.1.6", level: 1, unit: smb.service }
  - { id: "2.1.7", level: 1, unit: vsftpd.service }
  - { id: "2.1.8", level: 1, unit: dovecot.service }
  - { id: "2.1.8", level: 1, unit: cyrus-imapd.service }
  - { id: "2.1.9", level: 1, unit: nfs-server.service }
  - { id: "2.1.10", level: 1, unit: ypserv.service }
  - { id: "2.1.11", level: 1, unit: cups.service }
  - { id: "2.1.12", level: 1, unit: rpcbind.service }
  - { id: "2.1.12", level: 1, unit: rpcbind.socket }
  - { id: "2.1.13", level: 1, unit: rsyncd.service }
  - { id: "2.1.14", level: 1, unit: snmpd.service }
  - { id: "2.1.15", level: 1, unit: telnet.socket }
  - { id: "2.1.16", level: 1, unit: tftp.socket }
  - { id: "2.1.17", level: 1, unit: squid.service }
  - { id: "2.1.18", level: 1, unit: httpd.service }
  - { id: "2.1.18", level: 1, unit: nginx.service }
  - { id: "2.1.19", level: 1, unit: xinetd.service }

# 2.1.20 (Nivel 2) - Servidor X Window: se desinstala el paquete (no aplica mask, es un
# conjunto de binarios/paquete, no un unico servicio persistente en modo Server).
rhel9cis_x11_packages:
  - xorg-x11-server-common
  - xorg-x11-server-Xorg

# 2.2 - Paquetes cliente que no deben estar instalados
rhel9cis_unused_client_packages:
  - { id: "2.2.1", level: 1, package: ftp }
  - { id: "2.2.2", level: 2, package: openldap-clients }
  - { id: "2.2.3", level: 1, package: ypbind }
  - { id: "2.2.4", level: 1, package: telnet }
  - { id: "2.2.5", level: 1, package: tftp }

# 2.4.1 - Permisos de archivos/directorios de cron
rhel9cis_cron_paths:
  - { id: "2.4.1.2", path: /etc/crontab, mode: "0600" }
  - { id: "2.4.1.3", path: /etc/cron.hourly, mode: "0700" }
  - { id: "2.4.1.4", path: /etc/cron.daily, mode: "0700" }
  - { id: "2.4.1.5", path: /etc/cron.weekly, mode: "0700" }
  - { id: "2.4.1.6", path: /etc/cron.monthly, mode: "0700" }
  - { id: "2.4.1.7", path: /etc/cron.d, mode: "0700" }
