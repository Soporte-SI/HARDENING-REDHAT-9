---
# 5.4.1 - /etc/login.defs
rhel9cis_login_defs_settings:
  - { id: "5.4.1.1", key: PASS_MAX_DAYS, value: "365", level: 1 }
  - { id: "5.4.1.3", key: PASS_WARN_AGE, value: "7", level: 1 }
  - { id: "5.4.1.4", key: ENCRYPT_METHOD, value: "SHA512", level: 1 }
  - { id: "5.4.3.3", key: UMASK, value: "027", level: 1 }

# 5.2 - sudoers (archivo dedicado /etc/sudoers.d/99-cis-hardening)
rhel9cis_sudoers_lines:
  - { id: "5.2.2", line: "Defaults use_pty", level: 1 }
  - { id: "5.2.3", line: 'Defaults logfile="/var/log/sudo.log"', level: 1 }
  - { id: "5.2.6", line: "Defaults timestamp_timeout=15", level: 1 }

# 5.4.2.7 / 5.4.2.8 - cuentas de sistema: lista blanca que NUNCA se toca (ademas de root)
rhel9cis_system_accounts_whitelist:
  - root
  - sync
  - shutdown
  - halt
  - operator
  - postmaster
  - nologin-user
