[defaults]
inventory        = inventory/hosts.ini
roles_path       = roles
retry_files_enabled = False
host_key_checking = True
interpreter_python = auto_silent
stdout_callback  = default
forks            = 10
timeout          = 30
gathering        = smart
fact_caching     = jsonfile
fact_caching_connection = .ansible_fact_cache
fact_caching_timeout = 3600

[privilege_escalation]
become        = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
# CORREGIDO 2026-09-03: se quitó "-o PreferredAuthentications=publickey" -
# como ssh_args va SIEMPRE antes que ansible_ssh_extra_args en la línea de
# comandos real, y OpenSSH usa la PRIMERA ocurrencia de una opción repetida
# (ignora las siguientes), este valor pisaba el
# "PreferredAuthentications=gssapi-with-mic,gssapi-keyex" que se necesita
# para la conexión Kerberos a hosts de dominio (ver
# Ansible/execution-environment-krb5/kerberos_ticket_en_awx.md). Confirmado
# en el log de "ssh -vvv": "debug3: preferred publickey" a pesar de que el
# kinit/klist mostraban un ticket Kerberos válido - el ticket nunca era el
# problema, era esta línea forzando publickey primero.
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s

[callback_default]
result_format = default
